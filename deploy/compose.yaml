name: ${COMPOSE_PROJECT_NAME:-class-hub}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - "${WEB_ROOT:?WEB_ROOT is required}:/srv/web:ro"
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      api-prod:
        condition: service_healthy
      api-staging:
        condition: service_healthy
    networks: [app]

  api-prod:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${PROD_DATABASE_URL:?PROD_DATABASE_URL is required}
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEPLOY_VERSION: ${DEPLOY_VERSION:-unknown}
      BUILD_TIME: ${BUILD_TIME:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      STUDENT_ID_HMAC_KEY: ${STUDENT_ID_HMAC_KEY:?STUDENT_ID_HMAC_KEY is required}
      CLASS_ACTIVATION_CODE: ${CLASS_ACTIVATION_CODE:?CLASS_ACTIVATION_CODE is required}
      FALLBACK_OWNER_ID: ${FALLBACK_OWNER_ID:-}
      FALLBACK_OWNER_NAME: ${FALLBACK_OWNER_NAME:-}
      FALLBACK_OWNER_KEY: ${FALLBACK_OWNER_KEY:-}
      COOKIE_SECURE: "true"
      SESSION_DAYS: ${SESSION_DAYS:-30}
      ADMIN_REAUTH_MINUTES: ${ADMIN_REAUTH_MINUTES:-15}
    expose: ["3000"]
    mem_limit: 448m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app]

  api-staging:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: ${STAGING_DATABASE_URL:?STAGING_DATABASE_URL is required}
      APP_ORIGIN: https://${STAGING_DOMAIN:?STAGING_DOMAIN is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEPLOY_VERSION: ${DEPLOY_VERSION:-unknown}
      BUILD_TIME: ${BUILD_TIME:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      STUDENT_ID_HMAC_KEY: ${STUDENT_ID_HMAC_KEY:?STUDENT_ID_HMAC_KEY is required}
      CLASS_ACTIVATION_CODE: ${CLASS_ACTIVATION_CODE:?CLASS_ACTIVATION_CODE is required}
      FALLBACK_OWNER_ID: ${FALLBACK_OWNER_ID:-}
      FALLBACK_OWNER_NAME: ${FALLBACK_OWNER_NAME:-}
      FALLBACK_OWNER_KEY: ${FALLBACK_OWNER_KEY:-}
      COOKIE_SECURE: "true"
      SESSION_DAYS: ${SESSION_DAYS:-30}
      ADMIN_REAUTH_MINUTES: ${ADMIN_REAUTH_MINUTES:-15}
    expose: ["3000"]
    mem_limit: 448m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app]

volumes:
  caddy_data:
  caddy_config:

networks:
  app: