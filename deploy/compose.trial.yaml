name: class-hub-trial

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile.trial:/etc/caddy/Caddyfile:ro
      - "${WEB_ROOT:?WEB_ROOT is required}:/srv/web:ro"
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    networks: [app]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEPLOY_VERSION: ${DEPLOY_VERSION:-trial}
      BUILD_TIME: ${BUILD_TIME:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:-development-auth-secret-change-me-32chars}
      STUDENT_ID_HMAC_KEY: ${STUDENT_ID_HMAC_KEY:-development-student-id-secret-change-me}
      CLASS_ACTIVATION_CODE: ${CLASS_ACTIVATION_CODE:-CHANGE-ME-TRIAL-CODE}
      FALLBACK_OWNER_ID: ${FALLBACK_OWNER_ID:-}
      FALLBACK_OWNER_NAME: ${FALLBACK_OWNER_NAME:-}
      FALLBACK_OWNER_KEY: ${FALLBACK_OWNER_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      ADMIN_REAUTH_MINUTES: ${ADMIN_REAUTH_MINUTES:-15}
    expose: ["3000"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 768m
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

networks:
  app: