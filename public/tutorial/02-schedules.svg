    <rect x="326" y="76" width="136" height="58" rx="12" fill="#FFFCF7" stroke="#DED7CA"/>
    <text x="344" y="108" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#BF2C12">1</text>
